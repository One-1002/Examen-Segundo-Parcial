
services:
  hadoop:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: datamart-hadoop
    hostname: hadoop
    volumes:
      - ./${DATASET_FILE}:/data/input/${DATASET_FILE}:ro
      - ./mapreduce:/app/mapreduce:ro
      - hadoop_output:/data/output
      - ssh_keys:/shared/ssh
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: datamart-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datamart_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: datamart-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT}:5000"
    volumes:
      - ssh_keys:/shared/ssh:ro
      - hadoop_output:/data/output:ro
    depends_on:
      db:
        condition: service_healthy
      hadoop:
        condition: service_healthy
    networks:
      - datamart_network

volumes:
  postgres_data:
  hadoop_output:
  ssh_keys:

networks:
  datamart_network:
    driver: bridge
